name: qagen-vnext

on:
  pull_request:
    paths:
      - '.github/workflows/qagen-vnext.yml'
      - '.mirror-include'
      - 'MIRROR.md'
      - 'QA-Gen/docs/QA-gen-pipeline-target.md'
      - 'QA-Gen/docs/QA-gen-pipeline-vNext-plan.md'
      - 'QA-Gen/docs/Question-Rubric.md'
      - 'QA-Gen/qa_gen_pipeline/**'
      - 'docs/qa-gen/vnext-integration-boundary.md'
      - 'docs/_index.json'
      - 'docs/_search.json'
      - 'tests/test_docs_index.py'
      - 'tests/test_docs_search.py'
      - 'tests/test_qagen_vnext_integration_boundary.py'
      - 'tests/test_sync_from_sciencevision.py'
      - 'tests/offline_task_manager/test_trajectory.py'
      - 'tests/viewer/test_molstar_mcp_adapter.cjs'
      - 'tools/README.md'
      - 'tools/sync_from_sciencevision.py'
      - 'viewer/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root and QA-Gen vNext development packages
        run: >-
          python -m pip install build
          -e ".[dev]"
          -e "QA-Gen/qa_gen_pipeline[dev]"
      - name: Verify console-script ownership
        run: |
          python - <<'PY'
          from importlib.metadata import distribution

          expected = {
              "babyvision-v2": ("babyvision", "babyvision_v2.cli:main"),
              "sciencevision-qa-gen": ("qa-gen", "qagen.cli:main"),
          }
          names = set()
          for distribution_name, (script_name, target) in expected.items():
              scripts = {
                  entry.name: entry.value
                  for entry in distribution(distribution_name).entry_points
                  if entry.group == "console_scripts"
              }
              assert scripts.get(script_name) == target, (distribution_name, scripts)
              assert script_name not in names, f"console script collision: {script_name}"
              names.add(script_name)
          PY
          test "$(basename "$(command -v babyvision)")" = babyvision
          test "$(basename "$(command -v qa-gen)")" = qa-gen
          qa-gen --help >/dev/null
      - name: Check BabyVision integration boundary
        run: >-
          pytest -q
          tests/test_qagen_vnext_integration_boundary.py
          tests/test_sync_from_sciencevision.py
          tests/test_docs_index.py
          tests/test_docs_search.py
          tests/offline_task_manager/test_trajectory.py
      - name: Test anonymous Mol* MCP state
        run: node --test tests/viewer/test_molstar_mcp_adapter.cjs
      - name: Run QA-Gen vNext tests
        working-directory: QA-Gen/qa_gen_pipeline
        run: pytest -q
      - name: Validate static configuration
        working-directory: QA-Gen/qa_gen_pipeline
        run: python scripts/validate_static_config.py
      - name: Lint QA-Gen vNext
        working-directory: QA-Gen/qa_gen_pipeline
        run: ruff check --isolated --select E4,E7,E9,F src tests scripts
      - name: Compile QA-Gen vNext
        working-directory: QA-Gen/qa_gen_pipeline
        run: python -m compileall -q src
      - name: Build QA-Gen vNext distributions
        working-directory: QA-Gen/qa_gen_pipeline
        run: python -m build
      - name: Check distributions for runtime leakage
        working-directory: QA-Gen/qa_gen_pipeline
        run: python scripts/check_package_archives.py dist/*.tar.gz dist/*.whl
      - name: Smoke-test the installed QA-Gen wheel
        working-directory: QA-Gen/qa_gen_pipeline
        run: python scripts/smoke_installed_wheel.py dist/*.whl
