<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CityJSON viewer — Science Vision</title>
<link rel="stylesheet" href="/viewer/shared/style.css">
<script src="/viewer/shared/neg-banner.js" defer></script>
<link rel="modulepreload" href="/viewer/shared/vendor/three/0.160.0/build/three.module.js">
<link rel="modulepreload" href="/viewer/shared/vendor/three/0.160.0/examples/jsm/controls/OrbitControls.js">
<style>
  #scene { width: 100vw; height: calc(100vh - 49px); display: block; position: fixed; top: 49px; left: 0; }
  #info { position: fixed; bottom: 12px; left: 12px; background: rgba(13,17,23,0.85); padding: 8px 12px; border-radius: 4px; border: 1px solid #30363d; font: 11px ui-monospace, monospace; color: #8b949e; max-width: 380px; }
  #info b { color: #58a6ff; }
  #controls { position: fixed; top: 60px; left: 12px; background: rgba(13,17,23,0.85); padding: 8px 12px; border-radius: 4px; border: 1px solid #30363d; font: 11px ui-monospace, monospace; color: #c9d1d9; }
  #controls label { display: block; margin: 4px 0; }
  #legend { position: fixed; top: 60px; right: 12px; background: rgba(13,17,23,0.85); padding: 8px 12px; border-radius: 4px; border: 1px solid #30363d; font: 11px ui-monospace, monospace; color: #c9d1d9; display: none; max-height: 60vh; overflow: auto; }
</style>
</head>
<body>
<header class="topbar">
  <div><a class="back" href="/viewer/">← Shell</a><strong>CityJSON</strong> <span id="filename" class="meta"></span></div>
  <div class="meta">CityJSON 1.0–2.0 · inline parser + three.js Mesh</div>
</header>
<canvas id="scene"></canvas>
<div id="controls">
  <label>color by
    <select id="cmode">
      <option value="roof_type">Roof type (b3_dak_type)</option>
      <option value="height">Height (rainbow)</option>
      <option value="uniform">Uniform</option>
    </select>
  </label>
</div>
<div id="legend"></div>
<div id="info">drag = rotate · scroll = zoom · <b id="stats">loading…</b></div>
<script type="importmap">
{
  "imports": {
    "three": "/viewer/shared/vendor/three/0.160.0/build/three.module.js",
    "three/addons/": "/viewer/shared/vendor/three/0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const file = params.get('file');
document.getElementById('filename').textContent = file ? file.split('/').pop() : '(no file)';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x0d1117, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.6, 0.9, 0.5);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.01, 1e7);
camera.up.set(0, 0, 1);  // CityJSON is Z-up

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

function fail(msg) {
  document.body.insertAdjacentHTML('beforeend', '<div class="error-box">' + msg + '</div>');
  document.getElementById('stats').textContent = 'failed';
}

// Okabe-Ito colorblind-safe categorical palette, reused from pointcloud.html.
const PALETTE = [
  [0.00, 0.45, 0.70], [0.90, 0.62, 0.00], [0.00, 0.62, 0.45],
  [0.80, 0.47, 0.65], [0.94, 0.89, 0.26], [0.84, 0.37, 0.00],
  [0.35, 0.55, 0.85], [0.60, 0.60, 0.60],
];

// Walk a CityJSON geometry `boundaries` tree of any nesting (MultiSurface /
// Solid / CompositeSolid / MultiSolid) and yield each surface. A surface is an
// array of rings; a ring is an array of vertex indices (numbers). We detect a
// surface as "array whose first element is an array of numbers".
function collectSurfaces(node, out) {
  if (!Array.isArray(node) || node.length === 0) return;
  const first = node[0];
  if (Array.isArray(first) && typeof first[0] === 'number') {
    out.push(node);          // node is a surface: [outerRing, hole1, ...]
  } else {
    for (const child of node) collectSurfaces(child, out);
  }
}

// Highest LoD carries the most faithful massing; overlapping LoDs would z-fight.
function pickGeometry(geoms) {
  if (!Array.isArray(geoms) || geoms.length === 0) return null;
  let best = geoms[0], bestLod = -Infinity;
  for (const g of geoms) {
    const lod = parseFloat(g.lod);
    const v = Number.isFinite(lod) ? lod : 0;
    if (v >= bestLod) { bestLod = v; best = g; }
  }
  return best;
}

function parseCityJSON(cj) {
  const t = cj.transform || { scale: [1, 1, 1], translate: [0, 0, 0] };
  const sc = t.scale, tr = t.translate;
  const raw = cj.vertices || [];
  // Real-world coords; centered after we know the bbox to keep floats sane.
  const vx = new Float64Array(raw.length);
  const vy = new Float64Array(raw.length);
  const vz = new Float64Array(raw.length);
  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  for (let i = 0; i < raw.length; i++) {
    const x = raw[i][0] * sc[0] + tr[0];
    const y = raw[i][1] * sc[1] + tr[1];
    const z = raw[i][2] * sc[2] + tr[2];
    vx[i] = x; vy[i] = y; vz[i] = z;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = minZ;

  const positions = [];   // per-triangle-vertex xyz (centered)
  const heights = [];     // per-vertex centered z (for height coloring)
  const roofIdx = [];     // per-vertex roof-type palette index

  const objs = cj.CityObjects || {};
  const roofTypes = new Map();   // b3_dak_type -> palette index
  let nBuildings = 0, nTris = 0, nWithGeom = 0;

  const roofIndexFor = (type) => {
    if (type == null) return PALETTE.length - 1;  // unknown -> gray
    if (!roofTypes.has(type)) roofTypes.set(type, roofTypes.size % (PALETTE.length - 1));
    return roofTypes.get(type);
  };

  for (const id in objs) {
    const o = objs[id];
    if (o.type && String(o.type).startsWith('Building')) nBuildings++;
    const geom = pickGeometry(o.geometry);
    if (!geom || !geom.boundaries) continue;
    nWithGeom++;
    const rt = o.attributes ? o.attributes.b3_dak_type : null;
    const rIdx = roofIndexFor(rt);

    const surfaces = [];
    collectSurfaces(geom.boundaries, surfaces);
    for (const surf of surfaces) {
      const ring = surf[0];               // outer ring; holes ignored for preview
      if (!ring || ring.length < 3) continue;
      // Fan triangulation from the first vertex — exact for convex faces and a
      // faithful preview for the near-planar faces 3DBAG emits.
      for (let k = 1; k < ring.length - 1; k++) {
        const a = ring[0], b = ring[k], c = ring[k + 1];
        for (const vi of [a, b, c]) {
          positions.push(vx[vi] - cx, vy[vi] - cy, vz[vi] - cz);
          heights.push(vz[vi] - cz);
          roofIdx.push(rIdx);
        }
        nTris++;
      }
    }
  }

  return {
    positions: new Float32Array(positions),
    heights: new Float32Array(heights),
    roofIdx: new Uint16Array(roofIdx),
    roofTypes,
    nBuildings, nTris, nWithGeom,
    zRange: [0, maxZ - minZ],
    extentLabel: `${(maxX - minX).toFixed(0)} × ${(maxY - minY).toFixed(0)} × ${(maxZ - minZ).toFixed(0)} m`,
    version: cj.version || '?',
  };
}

function colorUniform(n) {
  const c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { c[i*3] = 0.62; c[i*3+1] = 0.66; c[i*3+2] = 0.72; }
  return c;
}
function colorHeight(heights, zRange) {
  const c = new Float32Array(heights.length * 3);
  const denom = (zRange[1] - zRange[0]) || 1;
  const col = new THREE.Color();
  for (let i = 0; i < heights.length; i++) {
    const tt = (heights[i] - zRange[0]) / denom;
    col.setHSL((1 - Math.min(1, Math.max(0, tt))) * 0.66, 0.9, 0.55);
    c[i*3] = col.r; c[i*3+1] = col.g; c[i*3+2] = col.b;
  }
  return c;
}
function colorRoof(roofIdx) {
  const c = new Float32Array(roofIdx.length * 3);
  for (let i = 0; i < roofIdx.length; i++) {
    const p = PALETTE[roofIdx[i] % PALETTE.length];
    c[i*3] = p[0]; c[i*3+1] = p[1]; c[i*3+2] = p[2];
  }
  return c;
}

let mesh = null, parsed = null;

function applyMode(mode) {
  if (!parsed || !mesh) return;
  let colors;
  if (mode === 'height') colors = colorHeight(parsed.heights, parsed.zRange);
  else if (mode === 'uniform') colors = colorUniform(parsed.heights.length);
  else colors = colorRoof(parsed.roofIdx);
  mesh.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  mesh.geometry.attributes.color.needsUpdate = true;
  const legend = document.getElementById('legend');
  if (mode === 'roof_type' && parsed.roofTypes.size) {
    const rows = [...parsed.roofTypes.entries()].map(([type, idx]) => {
      const p = PALETTE[idx % PALETTE.length];
      const sw = `rgb(${(p[0]*255)|0},${(p[1]*255)|0},${(p[2]*255)|0})`;
      return `<div><span style="display:inline-block;width:10px;height:10px;background:${sw};margin-right:6px"></span>${type}</div>`;
    }).join('');
    legend.innerHTML = `<div style="margin-bottom:4px;color:#8b949e">b3_dak_type</div>${rows}`;
    legend.style.display = 'block';
  } else {
    legend.style.display = 'none';
  }
}

if (!file) {
  fail('No ?file= query param.');
} else {
  fetch(file)
    .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
    .then(cj => {
      if (!cj || cj.type !== 'CityJSON') throw new Error('Not a CityJSON document');
      parsed = parseCityJSON(cj);
      if (parsed.positions.length === 0) throw new Error('No renderable surface geometry found');
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(parsed.positions, 3));
      geom.setAttribute('color', new THREE.BufferAttribute(colorRoof(parsed.roofIdx), 3));
      geom.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: 0.85, metalness: 0.0,
        flatShading: true, side: THREE.DoubleSide,
      });
      mesh = new THREE.Mesh(geom, mat);
      scene.add(mesh);

      geom.computeBoundingSphere();
      const r = geom.boundingSphere.radius || 1;
      camera.position.set(r * 1.1, -r * 1.1, r * 0.9);
      camera.near = r / 1000; camera.far = r * 100; camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0);
      controls.update();

      const sizeInfo = `CityJSON ${parsed.version}`;
      document.getElementById('stats').textContent =
        `${sizeInfo} · ${parsed.nBuildings.toLocaleString()} buildings (${parsed.nWithGeom} with geom) · ` +
        `${parsed.nTris.toLocaleString()} tris · ${parsed.extentLabel}`;
      applyMode(document.getElementById('cmode').value);
    })
    .catch(err => fail('Failed to load / parse:\n' + err));
}

document.getElementById('cmode').addEventListener('change', e => applyMode(e.target.value));

window.addEventListener('resize', () => {
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  camera.aspect = canvas.clientWidth / canvas.clientHeight;
  camera.updateProjectionMatrix();
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
