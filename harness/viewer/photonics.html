<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Photonics Record · Science Vision</title>
<link rel="stylesheet" href="/viewer/shared/style.css">
<style>
  main.photonics-detail { max-width: 1100px; padding: 24px; margin: 0 auto; }
  .photonics-detail h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.3; color: var(--fg); }
  .photonics-detail .article-meta {
    display: flex; flex-wrap: wrap; gap: 8px;
    color: var(--fg-dim); font-size: 12px; margin-bottom: 24px;
  }
  .photonics-detail .article-meta a { color: var(--accent); }
  .photonics-detail .article-meta .pill {
    background: var(--bg2); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px;
  }
  .photonics-detail .article-meta .pill.topic {
    color: var(--domain-photo); border-color: var(--domain-photo);
  }
  .photonics-detail h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--domain-photo);
    margin: 32px 0 12px;
  }
  .photonics-detail .readme {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
    padding: 16px 20px; line-height: 1.65;
  }
  .photonics-detail .readme h1, .photonics-detail .readme h2, .photonics-detail .readme h3 {
    color: var(--fg); border: none; text-transform: none; letter-spacing: 0;
    margin: 16px 0 6px; font-weight: 600;
  }
  .photonics-detail .readme h1 { font-size: 16px; margin-top: 0; }
  .photonics-detail .readme h2 { font-size: 14px; }
  .photonics-detail .readme h3 { font-size: 13px; color: var(--fg-dim); }
  .photonics-detail .readme code {
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(255,255,255,0.06); padding: 1px 6px; border-radius: 2px;
  }
  .photonics-detail .readme blockquote {
    margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--border);
    color: var(--fg-dim);
  }
  .photonics-detail .readme ul { padding-left: 20px; }
  .photonics-detail .readme li { margin: 2px 0; }
  .photonics-detail .figures {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .photonics-detail .fig-tile {
    border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
    background: #000; cursor: zoom-in; aspect-ratio: 4/3;
    display: flex; align-items: center; justify-content: center;
  }
  .photonics-detail .fig-tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .photonics-detail table.attachments {
    width: 100%; border-collapse: collapse; margin-top: 4px;
  }
  .photonics-detail table.attachments td, .photonics-detail table.attachments th {
    padding: 8px 12px; text-align: left;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .photonics-detail table.attachments th {
    color: var(--fg-dim); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .photonics-detail table.attachments td.fname {
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all;
  }
  .photonics-detail table.attachments td.size { color: var(--fg-dim); white-space: nowrap; }
  .photonics-detail table.attachments td.dl { text-align: right; white-space: nowrap; }
  .photonics-detail .kind-badge {
    display: inline-block; padding: 2px 8px; border-radius: 3px;
    font: 10px/1.1 ui-monospace, monospace; letter-spacing: 0.4px; text-transform: uppercase;
    border: 1px solid var(--border);
  }
  .photonics-detail .kind-badge.lumerical-project { color: #79c0ff; border-color: #79c0ff; }
  .photonics-detail .kind-badge.lumerical-script  { color: #a5d6ff; border-color: #a5d6ff; }
  .photonics-detail .kind-badge.lumerical-field   { color: #56d364; border-color: #56d364; }
  .photonics-detail .kind-badge.zemax-project,
  .photonics-detail .kind-badge.zemax-macro       { color: #d2a8ff; border-color: #d2a8ff; }
  .photonics-detail .kind-badge.asap-input,
  .photonics-detail .kind-badge.asap-script,
  .photonics-detail .kind-badge.asap-field        { color: #ffa657; border-color: #ffa657; }
  .photonics-detail .kind-badge.figure            { color: var(--domain-photo); border-color: var(--domain-photo); }
  .photonics-detail .kind-badge.other             { color: var(--fg-dim); }
  .photonics-detail .download-btn {
    display: inline-block; padding: 4px 12px; font-size: 12px;
    color: var(--accent); border: 1px solid var(--accent); border-radius: 3px;
    text-decoration: none;
  }
  .photonics-detail .download-btn:hover { background: rgba(88,166,255,0.1); text-decoration: none; }
  .photonics-detail details.provenance {
    margin-top: 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg2);
  }
  .photonics-detail details.provenance summary {
    padding: 10px 16px; cursor: pointer; font-size: 12px; color: var(--fg-dim);
    user-select: none;
  }
  .photonics-detail details.provenance pre {
    margin: 0; padding: 0 16px 16px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--fg); white-space: pre-wrap; overflow-x: auto;
  }
  .photonics-detail .paper-block {
    background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--domain-photo);
    padding: 12px 16px; border-radius: 0 4px 4px 0; margin: 8px 0;
    font-size: 13px; line-height: 1.5;
  }
  .photonics-detail .lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.92); z-index: 100;
    align-items: center; justify-content: center; cursor: zoom-out;
    padding: 24px;
  }
  .photonics-detail .lightbox.show { display: flex; }
  .photonics-detail .lightbox img { max-width: 100%; max-height: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
  .photonics-detail .empty-section { color: var(--fg-dim); font-style: italic; padding: 8px; }
</style>
</head>
<body>
<header class="topbar">
  <div>
    <a class="back" href="/viewer/index.html">←</a>
    <strong>Science Vision</strong>
    <span class="meta" id="topbar-title">— photonics record</span>
  </div>
  <div class="meta" id="article-id"></div>
</header>
<main class="photonics-detail" id="root">
  <div id="loading" style="color: var(--fg-dim);">loading…</div>
</main>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lightbox-img" alt=""></div>

<script>
// ── Mini Markdown renderer (handles only what the Ansys READMEs use) ────
function renderMd(src) {
  // Escape HTML.
  const esc = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Inline: code, links, bold.
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, (_, t) => `<code>${t}</code>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, (_, t) => `<strong>${t}</strong>`);
    s = s.replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    // Auto-link bare URLs (avoid those already inside HREFs we just made).
    s = s.replace(/(^|[^"=])(https?:\/\/[^\s<)]+)(?=$|[\s.,)])/g, (_, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
    return s;
  }

  const lines = src.split(/\r?\n/);
  const out = [];
  let inList = false;
  let inBlockquote = false;
  for (let raw of lines) {
    const line = raw.trimEnd();
    if (/^# (.+)/.test(line)) {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(`<h1>${inline(line.replace(/^# /, ''))}</h1>`);
      continue;
    }
    if (/^## (.+)/.test(line)) {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(`<h2>${inline(line.replace(/^## /, ''))}</h2>`);
      continue;
    }
    if (/^### (.+)/.test(line)) {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(`<h3>${inline(line.replace(/^### /, ''))}</h3>`);
      continue;
    }
    if (/^[-*] (.+)/.test(line)) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${inline(line.replace(/^[-*] /, ''))}</li>`);
      continue;
    }
    if (/^> (.+)/.test(line)) {
      if (inList) { out.push('</ul>'); inList = false; }
      if (!inBlockquote) { out.push('<blockquote>'); inBlockquote = true; }
      out.push(inline(line.replace(/^> /, '')) + '<br>');
      continue;
    }
    // Empty line — close lists/blockquotes.
    if (line.trim() === '') {
      if (inList) { out.push('</ul>'); inList = false; }
      if (inBlockquote) { out.push('</blockquote>'); inBlockquote = false; }
      continue;
    }
    if (inList) { out.push('</ul>'); inList = false; }
    if (inBlockquote) { out.push('</blockquote>'); inBlockquote = false; }
    out.push(`<p>${inline(line)}</p>`);
  }
  if (inList) out.push('</ul>');
  if (inBlockquote) out.push('</blockquote>');
  return out.join('\n');
}

// ── Helpers ─────────────────────────────────────────────────────────────
function humanSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}

function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.classList.add('show');
}

// ── Main load ──────────────────────────────────────────────────────────
async function main() {
  const params = new URLSearchParams(location.search);
  const path = params.get('path');
  if (!path) {
    document.getElementById('root').innerHTML =
      '<div class="error-box">Missing ?path=… query parameter.</div>';
    return;
  }
  // path looks like /crawl_data/photonics/ansys_optics/<rec>/
  const recBase = path.replace(/\/$/, '');
  let meta;
  try {
    const r = await fetch(`${recBase}/SOURCE.json`);
    if (!r.ok) throw new Error(`SOURCE.json HTTP ${r.status}`);
    meta = await r.json();
  } catch (e) {
    document.getElementById('root').innerHTML =
      `<div class="error-box">Failed to load ${recBase}/SOURCE.json: ${e}</div>`;
    return;
  }

  // README.md (best-effort).
  let readmeHtml = '';
  try {
    const r = await fetch(`${recBase}/README.md`);
    if (r.ok) readmeHtml = renderMd(await r.text());
  } catch (e) {
    readmeHtml = '';
  }

  // Render.
  document.getElementById('topbar-title').textContent = `— ${meta.title || meta.record_id}`;
  document.getElementById('article-id').textContent =
    meta.record_id ? `Article ID · ${meta.record_id}` : '';

  const figs = meta.figures || [];
  const figuresHtml = figs.length === 0
    ? '<div class="empty-section">(no figures captured for this record)</div>'
    : `<div class="figures">${figs.map(f => {
        const url = `${recBase}/${f.file}`;
        return `<div class="fig-tile" onclick="openLightbox('${url}')"><img src="${url}" alt="${f.caption || f.file}" loading="lazy"></div>`;
      }).join('')}</div>`;

  const attachments = meta.attachments || [];
  const attachmentsHtml = attachments.length === 0
    ? '<div class="empty-section">(no attachments)</div>'
    : `<table class="attachments">
        <thead><tr><th>File</th><th>Kind</th><th>Size</th><th></th></tr></thead>
        <tbody>${attachments.map(a => {
          const fname = a.file.replace(/^attachments\//, '');
          const url = `${recBase}/${a.file}`;
          const kindClass = (a.kind || 'other').replace(/[^a-z-]/gi, '');
          return `<tr>
            <td class="fname">${fname}</td>
            <td><span class="kind-badge ${kindClass}">${a.kind || 'other'}</span></td>
            <td class="size">${humanSize(a.size)}</td>
            <td class="dl"><a class="download-btn" href="${url}" download>Download</a></td>
          </tr>`;
        }).join('')}</tbody>
       </table>`;

  const paperHtml = meta.reproduces_paper
    ? `<h2>Reproduces paper</h2>
       <div class="paper-block">
         ${meta.reproduces_paper.citation || ''}
         ${meta.reproduces_paper.doi ? ` · <a href="https://doi.org/${meta.reproduces_paper.doi}" target="_blank">DOI</a>` : ''}
         ${meta.reproduces_paper.open_access === false ? ' <span style="color: var(--fg-dim); font-size: 12px;">(no open-access PDF)</span>' : ''}
       </div>`
    : '';

  const toolsHtml = (meta.tools || []).length
    ? (meta.tools).map(t => `<span class="pill">${t}</span>`).join('')
    : '';

  document.getElementById('root').innerHTML = `
    <h1>${meta.title || meta.record_id}</h1>
    <div class="article-meta">
      <span class="pill topic">${(meta.physics_topic || '').replace(/_/g,' ')}</span>
      ${toolsHtml}
      ${meta.source_url ? `<span class="pill"><a href="${meta.source_url}" target="_blank">↗ upstream Ansys KB</a></span>` : ''}
    </div>

    <div class="no3d-callout no3d-callout--photo">
      <strong>⚠ No in-browser 3D rendering.</strong>
      All attachments below are Ansys/Zemax/ASAP closed-binary engineering files
      (<code>.fsp</code> / <code>.lms</code> / <code>.zprj</code> / <code>.ZPL</code> / <code>.fld</code> / <code>.inr</code> / <code>.icp</code>) —
      geometry is locked inside these binaries and can only be opened by the original vendor software.
      <strong>None of them export to STEP / glTF / STL / OBJ / USD or any other browser-loadable 3D format.</strong>
      What you see here are the article's KB-page figures plus download links; for the actual 3D scene you must open the file in Lumerical / Zemax / ASAP.
    </div>

    ${readmeHtml ? `<h2>Description</h2><div class="readme">${readmeHtml}</div>` : ''}

    ${paperHtml}

    <h2>Figures (${figs.length})</h2>
    ${figuresHtml}

    <h2>Attachments (${attachments.length})</h2>
    ${attachmentsHtml}

    <details class="provenance">
      <summary>Provenance · raw SOURCE.json</summary>
      <pre>${JSON.stringify(meta, null, 2)}</pre>
    </details>
  `;
}

// Esc closes lightbox.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('show');
});

main();
</script>
</body>
</html>
