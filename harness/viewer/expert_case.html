<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Expert Seed Case — BabyVision-v2</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  main.ec-detail { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .ec-crumb { color: var(--fg-dim); font-size: 12px; margin-bottom: 16px; }
  .ec-crumb a { color: var(--fg-dim); }
  .ec-crumb a:hover { color: var(--accent); }
  .ec-header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .ec-badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px;
    background: var(--bg2); border: 1px solid var(--accent); color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .ec-chip {
    font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg-dim);
    text-transform: uppercase; letter-spacing: 0.04em;
    border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px;
  }
  .ec-chip.hard { color: #ffa657; border-color: #ffa657; }
  .ec-id { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg-dim); }
  .ec-dir { font-size: 15px; font-weight: 600; margin: 4px 0 2px; }
  .ec-scene { color: var(--fg-dim); font-size: 12px; margin-bottom: 14px; }
  .ec-question {
    font-size: 18px; line-height: 1.5; margin: 8px 0 18px;
    padding: 16px 20px; background: var(--bg2);
    border-left: 3px solid var(--accent); border-radius: 4px;
  }
  .ec-viewer-hint { color: var(--fg-dim); font-size: 12px; margin-bottom: 10px; }
  .ec-viewer-hint a { color: var(--accent); }
  .ec-viewer-wrap {
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    background: var(--bg); margin-bottom: 20px; position: relative;
  }
  .ec-viewer-wrap iframe { width: 100%; height: 780px; border: 0; display: block; background: #000; }
  .ec-viewer-loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--fg-dim); font-size: 13px; pointer-events: none;
    background: linear-gradient(180deg, rgba(13,17,23,0.9), rgba(13,17,23,0.4));
    transition: opacity 0.3s;
  }
  .ec-viewer-loading.hidden { opacity: 0; }
  .ec-viewer-actions { padding: 8px 12px; background: var(--bg2); font-size: 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .ec-viewer-actions a { color: var(--accent); }
  .ec-ans {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 0; background: var(--bg2); margin-bottom: 20px;
  }
  .ec-ans summary { cursor: pointer; padding: 10px 16px; font-size: 13px; user-select: none; }
  .ec-ans summary:hover { color: var(--accent); }
  .ec-warn { color: #ffa657; font-size: 11px; margin-left: 8px; }
  .ec-ans pre {
    margin: 0; padding: 12px 16px; border-top: 1px solid var(--border);
    background: var(--bg); overflow-x: auto;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg);
  }
  .ec-forbidden { font-size: 11px; color: var(--fg-dim); margin: 0 0 20px; }
  .ec-forbidden code { color: var(--fg); }
  .ec-nav { display: flex; gap: 12px; margin-top: 12px; font-size: 13px; }
  .ec-nav a { padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px; color: var(--fg-dim); }
  .ec-nav a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .ec-err { color: #f85149; padding: 24px; text-align: center; }
</style>
</head>
<body>
<header class="topbar">
  <div>
    <a href="index.html" class="home-link" style="color:inherit;text-decoration:none">
      <strong id="brand">BabyVision-v2</strong>
    </a>
    <span style="color:var(--fg-dim);margin-left:8px;font-size:12px">
      / <a href="qagen.html" style="color:inherit">QA Tasks</a> /
      <a href="qagen.html#expert-seed" style="color:inherit">Expert Seed</a> /
      <span id="qid-crumb">…</span>
    </span>
  </div>
  <div class="topbar-right">
    <nav class="bv2-globalnav" aria-label="Global">
      <a href="index.html">Home</a>
      <a href="docs.html">Doc</a>
      <a href="assets.html">Domain 3D Assets</a>
      <a href="qagen.html" class="is-active">QA Tasks</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="/sv-annotate/">Expert</a>
    </nav>
    <div class="meta" id="counts">loading…</div>
  </div>
</header>
<main class="ec-detail">
  <div id="ec-body">Loading…</div>
</main>

<script src="shared/manifest.js"></script>
<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Bump when the embedded viewers (molstar.html / niivue.html) change behaviour.
  // It becomes a query param on the iframe URL so returning visitors fetch the
  // updated viewer instead of a stale copy the browser cached (viewer HTML is
  // served with a 1h max-age, and JS-injected iframes don't revalidate on a
  // parent hard-refresh). v2: molstar.html sniffs small-molecule CIF → cifCore.
  const VIEWER_VER = '2';

  // Build the in-browser viewer URL for a seed item. Mirrors seedViewerURL()
  // in qagen.html: Niivue for NIfTI volumes, Mol* for molecular structures
  // (type= is the raw extension; molstar.html routes cif→mmcif/cifCore, …).
  function seedViewerURL(item) {
    const file = item.url_viewer;
    if (!file) return null;
    if (item.asset_kind === 'nifti' || /\.nii(\.gz)?$/.test(file)) {
      return 'niivue.html?file=' + encodeURIComponent(file) + '&_v=' + VIEWER_VER;
    }
    const ext = (file.split('.').pop() || '').toLowerCase();
    return 'molstar.html?file=' + encodeURIComponent(file)
      + '&type=' + encodeURIComponent(ext) + '&_v=' + VIEWER_VER;
  }

  function prettyAnswer(ans) {
    if (ans == null) return '';
    try { return JSON.stringify(JSON.parse(ans), null, 2); } catch (e) { return String(ans); }
  }

  function fail(msg) {
    document.getElementById('ec-body').innerHTML = '<div class="ec-err">' + esc(msg) + '</div>';
  }

  function render(item) {
    const viewerHref = seedViewerURL(item);
    const hard = (item.difficulty || '').toLowerCase() === 'hard';
    const parts = [];

    parts.push('<div class="ec-crumb">',
      '<a href="qagen.html">QA Tasks</a> · ',
      '<a href="qagen.html#expert-seed">Expert Seed Cases</a> · ',
      '<span>' + esc(item.domainLabel || item.domain || '') + '</span></div>');

    parts.push('<div class="ec-header">',
      '<span class="ec-badge">' + esc(item.domainLabel || item.domain || '—') + '</span>',
      (item.difficulty ? '<span class="ec-chip' + (hard ? ' hard' : '') + '">' + esc(item.difficulty) + '</span>' : ''),
      (item.v_class ? '<span class="ec-chip">' + esc(item.v_class) + '</span>' : ''),
      '<span class="ec-id">' + esc(item.qid) + '</span>',
      '</div>');

    parts.push('<div class="ec-dir">' + esc(item.direction_title || item.direction_id || '') + '</div>');
    if (item.scene) parts.push('<div class="ec-scene">' + esc(item.scene) + '</div>');

    parts.push('<div class="ec-question">' + esc(item.question) + '</div>');

    if (viewerHref) {
      parts.push(
        '<div class="ec-viewer-hint">Interactive 3D view — drag to rotate · scroll to zoom. ',
        '<a href="' + esc(viewerHref) + '" target="_blank" rel="noopener">Open full-screen ↗</a></div>',
        '<div class="ec-viewer-wrap">',
        '<iframe id="ec-frame" src="' + esc(viewerHref) + '" title="3D viewer" loading="eager"></iframe>',
        '<div class="ec-viewer-loading" id="ec-loading">Loading 3D structure… (a few seconds on larger assets)</div>',
        '<div class="ec-viewer-actions">',
        '<a href="' + esc(viewerHref) + '" target="_blank" rel="noopener">Open viewer in new tab ↗</a>',
        '<span style="color:var(--fg-dim)">·</span>',
        '<a href="' + esc(item.url_viewer) + '" target="_blank" rel="noopener">Download raw asset ↗</a>',
        '</div></div>');
    } else {
      parts.push('<div class="ec-viewer-wrap" style="padding:24px;text-align:center;color:var(--fg-dim)">',
        'No in-browser renderer wired for this asset. ',
        '<a href="' + esc(item.url_viewer) + '" target="_blank" rel="noopener">Download raw asset ↗</a></div>');
    }

    const ansText = prettyAnswer(item.answer);
    if (ansText) {
      parts.push('<details class="ec-ans">',
        '<summary>Show expected answer<span class="ec-warn">⚠ reveals the ground truth</span></summary>',
        '<pre>' + esc(ansText) + '</pre></details>');
    }

    if (Array.isArray(item.forbidden_tools) && item.forbidden_tools.length) {
      parts.push('<p class="ec-forbidden">Must be solved from the 3D geometry — no <code>' +
        item.forbidden_tools.map(esc).join('</code>, <code>') + '</code>.</p>');
    }

    parts.push('<div class="ec-nav"><a href="qagen.html#expert-seed">← Back to Expert Seed Cases</a></div>');

    document.getElementById('ec-body').innerHTML = parts.join('');
    document.getElementById('qid-crumb').textContent = item.qid;
    document.title = 'Expert Seed · ' + item.qid + ' — BabyVision-v2';

    const frame = document.getElementById('ec-frame');
    const loading = document.getElementById('ec-loading');
    if (frame && loading) {
      frame.addEventListener('load', () => loading.classList.add('hidden'));
      setTimeout(() => loading.classList.add('hidden'), 20000);
    }
  }

  const params = new URLSearchParams(location.search);
  const qid = params.get('qid') || params.get('id');
  if (!qid) { fail('Missing ?qid=<case_id> query param.'); }
  else {
    fetch('/data/expert_qa_seed.json', { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : Promise.reject('expert_qa_seed.json HTTP ' + r.status))
      .then(data => {
        let found = null;
        for (const g of (data.domains || [])) {
          for (const it of (g.items || [])) {
            if (it.qid === qid) { found = Object.assign({ domain: g.key, domainLabel: g.label }, it); break; }
          }
          if (found) break;
        }
        if (!found) { fail('Case not found: ' + qid); return; }
        render(found);
      })
      .catch(e => fail('Load failed: ' + e));
  }

  if (window.ManifestReady) {
    window.ManifestReady.then((m) => { document.getElementById('counts').textContent = m.brand + ' v' + m.version; });
  }
})();
</script>
</body>
</html>
