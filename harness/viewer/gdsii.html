<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GDSII layout — Science Vision</title>
<link rel="stylesheet" href="/viewer/shared/style.css">
<script src="/viewer/shared/neg-banner.js" defer></script>
<style>
  #canv { position: fixed; top: 49px; left: 0; right: 0; bottom: 0; background: #0d1117; display: block; }
  #info { position: fixed; bottom: 12px; left: 12px; background: rgba(13,17,23,0.85); padding: 8px 12px; border-radius: 4px; border: 1px solid #30363d; font: 11px ui-monospace, monospace; color: #8b949e; max-width: 420px; }
  #info b { color: var(--domain-topo); }
  #legend { position: fixed; top: 60px; right: 12px; background: rgba(13,17,23,0.85); padding: 8px 12px; border-radius: 4px; border: 1px solid #30363d; font: 11px ui-monospace, monospace; color: #c9d1d9; max-height: 70vh; overflow-y: auto; }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  #legend .swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid #30363d; }
</style>
</head>
<body>
<header class="topbar">
  <div><a class="back" href="/viewer/">← Shell</a><strong>GDSII</strong> <span id="filename" class="meta"></span></div>
  <div class="meta">2D fab layout · BOUNDARY records → Canvas2D</div>
</header>
<canvas id="canv"></canvas>
<div id="legend"><div style="font-weight:600;margin-bottom:4px;">Layers</div><div id="legendBody"></div></div>
<div id="info">drag = pan · wheel = zoom · <b id="stats">loading…</b></div>
<script>
const params = new URLSearchParams(location.search);
const file = params.get('file');
document.getElementById('filename').textContent = file ? file.split('/').pop() : '(no file)';

function fail(msg) {
  document.body.insertAdjacentHTML('beforeend', '<div class="error-box">' + msg + '</div>');
}

// GDSII record types we care about. Reference: KLayout doc / Cadence spec.
const REC = {
  HEADER: 0x00, BGNLIB: 0x01, LIBNAME: 0x02, UNITS: 0x03, ENDLIB: 0x04,
  BGNSTR: 0x05, STRNAME: 0x06, ENDSTR: 0x07,
  BOUNDARY: 0x08, PATH: 0x09, SREF: 0x0A, AREF: 0x0B,
  TEXT: 0x0C, LAYER: 0x0D, DATATYPE: 0x0E, WIDTH: 0x0F,
  XY: 0x10, ENDEL: 0x11, SNAME: 0x12,
};

// Parse GDSII binary stream. Returns flat list of polygons {layer, datatype, struct, points: [[x,y],...]}.
function parseGDSII(buffer) {
  const v = new DataView(buffer);
  const n = buffer.byteLength;
  let off = 0;
  const polygons = [];
  let curStruct = null;
  let curElement = null;  // { kind: 'BOUNDARY'|'PATH', layer, datatype, xy }
  let userUnit = 1, dbUnit = 1e-9;

  while (off + 4 <= n) {
    const recLen = v.getUint16(off, false);
    if (recLen < 4 || off + recLen > n) break;
    const recType = v.getUint8(off + 2);
    // const dataType = v.getUint8(off + 3);
    const dataStart = off + 4;
    const dataLen = recLen - 4;

    switch (recType) {
      case REC.UNITS: {
        // 2 × float64 (GDSII 8-byte float, big-endian, custom mantissa) — KLayout testdata stores
        // standard IEEE here in many cases; we don't strictly need units to render normalized.
        // Skip strict parsing; just record presence.
        break;
      }
      case REC.BGNSTR: break;
      case REC.STRNAME: {
        let s = '';
        for (let i = 0; i < dataLen; i++) {
          const c = v.getUint8(dataStart + i);
          if (c === 0) break;
          s += String.fromCharCode(c);
        }
        curStruct = s;
        break;
      }
      case REC.ENDSTR: curStruct = null; break;
      case REC.BOUNDARY: curElement = { kind: 'BOUNDARY', layer: 0, datatype: 0, xy: [] }; break;
      case REC.PATH:     curElement = { kind: 'PATH', layer: 0, datatype: 0, xy: [], width: 0 }; break;
      case REC.LAYER:    if (curElement) curElement.layer = v.getInt16(dataStart, false); break;
      case REC.DATATYPE: if (curElement) curElement.datatype = v.getInt16(dataStart, false); break;
      case REC.WIDTH:    if (curElement) curElement.width = v.getInt32(dataStart, false); break;
      case REC.XY: {
        if (curElement) {
          // Sequence of int32 X/Y pairs
          for (let i = 0; i + 8 <= dataLen; i += 8) {
            const x = v.getInt32(dataStart + i, false);
            const y = v.getInt32(dataStart + i + 4, false);
            curElement.xy.push([x, y]);
          }
        }
        break;
      }
      case REC.ENDEL: {
        if (curElement && curElement.xy.length >= 3) {
          polygons.push({
            layer: curElement.layer,
            datatype: curElement.datatype,
            struct: curStruct,
            kind: curElement.kind,
            points: curElement.xy,
            width: curElement.width || 0,
          });
        }
        curElement = null;
        break;
      }
    }
    off += recLen;
  }
  return polygons;
}

const layerPalette = [
  '#f78166', '#56d364', '#d2a8ff', '#79c0ff', '#ffa657',
  '#ff7b72', '#3fb950', '#a371f7', '#1f6feb', '#db6d28',
];

function colorForLayer(layer, layerIdx) {
  return layerPalette[layerIdx % layerPalette.length];
}

const canvas = document.getElementById('canv');
const ctx = canvas.getContext('2d');
let view = { x: 0, y: 0, scale: 1 };
let polys = [];
let bbox = null;
let layerOrder = [];

function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

function fitView() {
  if (!bbox) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const dataW = bbox.maxX - bbox.minX, dataH = bbox.maxY - bbox.minY;
  view.scale = 0.9 * Math.min(w / dataW, h / dataH);
  view.x = w / 2 - view.scale * (bbox.minX + dataW / 2);
  view.y = h / 2 + view.scale * (bbox.minY + dataH / 2);  // flip Y (canvas Y goes down)
}

function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, w, h);
  for (const p of polys) {
    const idx = layerOrder.indexOf(p.layer);
    const color = colorForLayer(p.layer, idx);
    ctx.beginPath();
    for (let i = 0; i < p.points.length; i++) {
      const [x, y] = p.points[i];
      const sx = view.x + view.scale * x;
      const sy = view.y - view.scale * y;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    if (p.kind === 'BOUNDARY') {
      ctx.closePath();
      ctx.fillStyle = color + '80';  // 50% alpha
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1, p.width * view.scale);
      ctx.stroke();
    }
  }
}

let dragging = false, dragLast = null;
canvas.addEventListener('mousedown', e => { dragging = true; dragLast = [e.clientX, e.clientY]; });
canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging = false; });
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  view.x += e.clientX - dragLast[0];
  view.y += e.clientY - dragLast[1];
  dragLast = [e.clientX, e.clientY];
  draw();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  // Convert mouse coord to data coord
  const dx = (mx - view.x) / view.scale;
  const dy = (view.y - my) / view.scale;
  const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
  view.scale *= factor;
  view.x = mx - view.scale * dx;
  view.y = my + view.scale * dy;
  draw();
}, { passive: false });
window.addEventListener('resize', () => { resize(); draw(); });

if (!file) {
  fail('No ?file= query param.');
} else {
  fetch(file)
    .then(r => r.ok ? r.arrayBuffer() : Promise.reject('HTTP ' + r.status))
    .then(buf => {
      polys = parseGDSII(buf);
      if (!polys.length) throw new Error('No BOUNDARY/PATH records parsed (file may use only SREF/AREF references)');
      // Compute bbox & layer order
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      const layerSet = new Set();
      for (const p of polys) {
        layerSet.add(p.layer);
        for (const [x, y] of p.points) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
      bbox = { minX, maxX, minY, maxY };
      layerOrder = [...layerSet].sort((a, b) => a - b);

      // Legend
      const lb = document.getElementById('legendBody');
      lb.innerHTML = '';
      const counts = {};
      for (const p of polys) counts[p.layer] = (counts[p.layer] || 0) + 1;
      for (let i = 0; i < layerOrder.length; i++) {
        const L = layerOrder[i];
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<span class="swatch" style="background:${colorForLayer(L, i)}"></span>layer ${L} <span style="color:#8b949e">(${counts[L]})</span>`;
        lb.appendChild(row);
      }

      resize();
      fitView();
      draw();

      const sizeKB = (buf.byteLength / 1024).toFixed(1);
      document.getElementById('stats').textContent =
        `${polys.length} polygons · ${layerOrder.length} layers · ${(maxX - minX).toFixed(0)} × ${(maxY - minY).toFixed(0)} db-units · ${sizeKB} KB`;
    })
    .catch(err => fail('Failed to load / parse:\n' + err));
}
</script>
</body>
</html>
