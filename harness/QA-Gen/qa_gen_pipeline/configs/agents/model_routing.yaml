schema_version: 1
kind: qagen_model_routing
enabled: false
routing_status: unverified_logical_defaults
schema_reference_state: planned
run_eligibility: blocked
blocked_reasons:
  - Logical routes are disabled and model availability is unverified.
  - Planned schema references have no runtime binding in this package.

# This is the same policy shape consumed by qagen.workers. All providers and
# roles remain disabled until an explicit runtime adapter and approval exist.
providers:
  anthropic:
    configured: false
    credential_ref: null
    endpoint: null
    availability_status: unverified
    approval_status: not_approved
  deepseek:
    configured: false
    credential_ref: null
    endpoint: null
    availability_status: unverified
    approval_status: not_approved
  openai:
    configured: false
    credential_ref: null
    endpoint: null
    availability_status: unverified
    approval_status: not_approved
  fixture:
    configured: false
    credential_ref: null
    endpoint: null
    availability_status: local_fixture_only
    approval_status: not_approved
    local_only: true
    production_eligible: false

roles:
  brief_builder:
    enabled: false
    provider: anthropic
    allowed_models: [opus-5]
    max_tokens: 9500
    max_cost_usd: 0.25
    max_latency_seconds: 45
    input_schema: qagen://schemas/task-brief/input/v1
    output_schema: qagen://schemas/task-brief/output/v1
  author:
    enabled: false
    provider: deepseek
    allowed_models: [dpsk-v4-pro]
    max_tokens: 20000
    max_cost_usd: 2.00
    max_latency_seconds: 120
    input_schema: qagen://schemas/author/input/v1
    output_schema: qagen://schemas/candidate/v1
  truth_builder:
    enabled: false
    provider: deepseek
    allowed_models: [dpsk-v4-pro]
    max_tokens: 19000
    max_cost_usd: 1.25
    max_latency_seconds: 90
    input_schema: qagen://schemas/truth-builder/input/v1
    output_schema: qagen://schemas/author-truth-receipt/v1
  evidence_worker:
    enabled: false
    provider: deepseek
    allowed_models: [dpsk-v4-pro]
    max_tokens: 14000
    max_cost_usd: 0.50
    max_latency_seconds: 75
    input_schema: qagen://schemas/evidence-worker/input/v1
    output_schema: qagen://schemas/viewer-evidence-packet/v1
  verifier:
    enabled: false
    provider: openai
    allowed_models: [gpt-5.6-sol]
    max_tokens: 18500
    max_cost_usd: 1.00
    max_latency_seconds: 90
    input_schema: qagen://schemas/verifier/input/v1
    output_schema: qagen://schemas/verification-result/v1
  rewriter:
    enabled: false
    provider: deepseek
    allowed_models: [dpsk-v4-pro]
    max_tokens: 19000
    max_cost_usd: 1.50
    max_latency_seconds: 120
    input_schema: qagen://schemas/rewriter/input/v1
    output_schema: qagen://schemas/candidate/v1

# This metadata names the only local adapter. It is not a configured provider
# route; fixture execution still requires an explicit test policy.
fixture_adapter:
  kind: qagen_local_fixture_adapter
  enabled: false
  local_only: true
  production_eligible: false
  provider: fixture
  model: deterministic-fixture
  credential_ref: null
  endpoint: null
  availability_status: local_fixture_only
  approval_status: not_approved
