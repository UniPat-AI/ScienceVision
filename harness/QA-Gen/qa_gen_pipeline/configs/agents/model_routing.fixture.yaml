schema_version: 1
kind: qagen_model_routing
enabled: true
routing_status: local_test_verified
run_eligibility: local_test

# This policy is intentionally separate from model_routing.yaml. It is the
# only policy that can invoke the deterministic local adapter, and it is
# digest-locked by local_fixture_compile profiles.
providers:
  fixture-author:
    configured: true
    local_only: true
    allowed_models:
      - deterministic-fixture
  fixture-verifier:
    configured: true
    local_only: true
    allowed_models:
      - deterministic-verifier

roles:
  brief_builder:
    enabled: true
    provider: fixture-author
    allowed_models: [deterministic-fixture]
    max_tokens: 64
    max_cost_usd: 0.0
    max_latency_seconds: 10
    input_schema: qagen://schemas/task-brief/input/v1
    output_schema: qagen://schemas/task-brief/output/v1
  author:
    enabled: true
    provider: fixture-author
    allowed_models: [deterministic-fixture]
    max_tokens: 64
    max_cost_usd: 0.0
    max_latency_seconds: 10
    input_schema: qagen://schemas/author/input/v1
    output_schema: qagen://schemas/candidate/v1
  truth_builder:
    enabled: true
    provider: fixture-author
    allowed_models: [deterministic-fixture]
    max_tokens: 64
    max_cost_usd: 0.0
    max_latency_seconds: 10
    input_schema: qagen://schemas/truth-builder/input/v1
    output_schema: qagen://schemas/author-truth-receipt/v1
  evidence_worker:
    enabled: true
    provider: fixture-author
    allowed_models: [deterministic-fixture]
    max_tokens: 64
    max_cost_usd: 0.0
    max_latency_seconds: 10
    input_schema: qagen://schemas/evidence-worker/input/v1
    output_schema: qagen://schemas/viewer-evidence-packet/v1
  verifier:
    enabled: true
    provider: fixture-verifier
    allowed_models: [deterministic-verifier]
    max_tokens: 64
    max_cost_usd: 0.0
    max_latency_seconds: 10
    input_schema: qagen://schemas/verifier/input/v1
    output_schema: qagen://schemas/verification-result/v1
  rewriter:
    enabled: true
    provider: fixture-author
    allowed_models: [deterministic-fixture]
    max_tokens: 64
    max_cost_usd: 0.0
    max_latency_seconds: 10
    input_schema: qagen://schemas/rewriter/input/v1
    output_schema: qagen://schemas/candidate/v1

fixture_adapter:
  enabled: true
  local_only: true
  production_eligible: false
  provider: fixture-author
  model: deterministic-fixture
