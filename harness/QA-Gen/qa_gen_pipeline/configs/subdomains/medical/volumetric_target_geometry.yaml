schema_version: 1
kind: qagen_subdomain_config
id: medical.volumetric_target_geometry
domain: medical
status: blocked
production_status: not_approved
readiness:
  config: config_ready
  generation: blocked
  release: blocked
blocked_reasons:
  - medical_domain_release_blocked
  - repaired_expert_reviewed_seed_missing
  - expert_knowledge_approval_missing
  - viewer_capability_evidence_missing
  - selection_mapping_approval_missing
  - m3d_refseg_semantic_annotation_source_missing
required_inputs:
  - id: seed.repaired_expert_verified
    state: missing
  - id: knowledge.approved_snapshot
    state: missing
  - id: viewer.volumetric_geometry_evidence
    state: unverified
  - id: mapping.human_approval
    state: missing
  - id: review.production_approval
    state: blocked
  - id: semantic_gt.m3d_refseg_doctor_annotation
    state: missing

visual_skills:
  - volumetric_target_localization
  - localize_then_measure_with_calibrated_tolerance
question_type_policy:
  allowed_question_family_kinds:
    - property_identification
    - attribute_classification
    - paired_comparison
  medical_modes:
    - localize_then_measure_no_overlay
  measurement_default_allowed: false
asset_facets:
  tracked_dimensions: [body_region, organ_system, anatomy, pathology, modality, dataset]
  coverage_dedupe_key: [dataset, normalized_asset_facets, question_kernel]
  family_diversity_required: true
  label_identity_policy: preserve
semantic_gt:
  source_id: m3d_refseg_doctor_annotation
  source_status: missing
  solver_projection:
    primary_image: true
    excluded_artifacts: [segmentation, mask, overlay]
seed:
  query:
    domain: medical
    subdomain: volumetric_target_geometry
    required_status: verified
asset:
  required_conditions:
    - anonymous_scene
    - primary_image
    - controlled_session
viewer:
  required_operations:
    - inspect
    - slice
  capability_modes:
    - id: primary_image_localization
      generation_strategies:
        - preserve_intent
        - reauthor_on_asset
      required_operations:
        - window_level
        - slice
answer:
  allowed_truth_modes:
    - visual_annotation
    - viewer_native_measurement
evidence:
  required:
    - viewer_trace
    - primary_image_localization_evidence
    - manual_measurement_calibration_receipt
knowledge:
  source_refs:
    - source_id: expert-knowledge-master
      source_revision: 298
      coverage: source_only
  locked_refs: []
release:
  eligible: false
  reason: "Blocked until seed repair, expert-knowledge approval, controlled-viewer capability evidence, mapping approval, and medical release approval are all present."
