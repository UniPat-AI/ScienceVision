schema_version: 1
kind: qagen_seed_source_spec
id: ev2-pilot-reviewed-sample-cases
importer: ev2_local_package_v1
mode: controlled

# The local path is supplied out of band. No developer-specific absolute path
# is committed, and sync must compare the resolved environment and CLI roots.
root_env: QAGEN_EV2_SOURCE_ROOT
expected_basename: ev2-pilot-sample-cases-by-type-20260820-v1.0.3-dsstore-fix
file_roles:
  manifest:
    path: MANIFEST.json
    format: json
    parser_contract: ev2_manifest_v1
  version_note:
    path: README.md
    format: markdown
    parser_contract: ev2_version_note_v1
  tasks:
    path: tasks/tasks.jsonl
    format: jsonl
    parser_contract: ev2_tasks_v1
  expert_review:
    path: provenance/expert-review.json
    format: json
    parser_contract: ev2_expert_review_v1
  asset_manifest:
    path: provenance/asset-manifest.jsonl
    format: jsonl
    parser_contract: ev2_asset_manifest_v1

taxonomy_aliases:
  path: aliases/ev2_subdomain_aliases.yaml
  version: 1
  content_digest: sha256:b8a180f785052e19e44e73a9df699c47970fd669a1c426bea1480a69a709c0bf

version_policy: require_human_resolution_on_conflict
local_only: true
production_eligible: false
expected_inventory_digest: sha256:063b0347fe3a72704ccb23aab81ccc0414e9d12bed3b3cba9eec901ee2f73e1a

expected_package:
  package_id: ev2-pilot-sample-cases-by-type-20260820-v1.0.3-dsstore-fix
  version_labels:
    directory: v1.0.3
    manifest: v1.0.3
    package_id: v1.0.3
    version_note: v1.0.2
  case_count: 15
  review_distribution:
    verified: 3
    minor_fix: 2
    factual_error: 6
    unscorable: 4
  provenance:
    required_fields:
      - task_id
      - domain
      - sub_domain.slug
      - expert_review.verdict_class
      - provenance.source_suite
      - asset.repo_path
      - asset.sha256
      - reference_answer.status
    require_asset_sha256: true
    require_asset_package_path: true
    require_asset_byte_size: true
    require_source_suite: true
