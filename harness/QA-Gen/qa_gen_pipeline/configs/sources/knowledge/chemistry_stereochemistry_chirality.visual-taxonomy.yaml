content:
  visual_target_types:
    - tetrahedral_stereocenter
    - four_substituent_path_geometry
    - mirror_related_configuration
    - non_stereogenic_control_site

  forbidden_shortcuts:
    - raw_asset_read
    - metadata_lookup
    - network_search
    - arbitrary_compute
    - compound_identity_lookup
    - line_notation_stereochemistry
    - coordinate_parser
    - stereochemistry_toolkit

  evidence_requirements:
    required_viewer_operations:
      - inspect
      - rotate
    required_evidence:
      - digest-bound viewer trace
      - visual annotation of each claimed center
      - visual annotation of the four compared substituent paths
      - final orientation or view state used for the judgment
    allowed_truth_modes:
      - expert_visual_judgment
      - visual_annotation

  requirements:
    asset_requirements:
      - anonymous scene reference with no public compound identity
      - complete local connectivity for each evaluated center
      - all required substituents represented or explicitly visible through controlled inspection
      - stable anonymous atom labels for evidence binding
    viewer_requirements:
      - controlled inspect and rotate operations
      - stable scene state across evidence capture
      - center and substituent-path highlighting or equivalent visual annotation
      - no raw file, metadata, network, or automated stereochemistry access
    answer_modes:
      - structured center assessment with evidence references
      - categorical configuration only when the reviewed observability preconditions hold
