schema_version: 1
kind: qagen_domain_config
id: mechanical_cad
domain_status: catalog_only
catalog_leaves:
  - mechanical_cad.assembly_interference_clearance
  - mechanical_cad.assembly_bom_relation
  - mechanical_cad.manufacturability_draft_undercut
  - mechanical_cad.drawing_section_consistency
  - mechanical_cad.drawing_feature_to_3d_region_mapping
  - mechanical_cad.tool_accessibility
  - mechanical_cad.gdt_validation
  - mechanical_cad.motion_envelope
  - mechanical_cad.pointcloud_assembly_qc

policy:
  allowed_viewer_operations:
    - inspect
    - isolate
    - rotate
    - explode
    - section_cut
    - overlay_compare
    - measure_distance
    - measure_angle
  forbidden_capabilities:
    - network
    - asset_file_read
    - raw_asset_metadata
    - raw_asset_read
    - arbitrary_compute
    - unrestricted_compute

viewer_defaults:
  required_capabilities:
    - anonymous_scene
    - controlled_session_request
    - stable_part_identifier_scheme
    - stated_scale_and_unit
