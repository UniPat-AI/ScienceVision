version = "1.0"

[task]
name = "sci3d/sv-astronomy-v5-0001"

[metadata]
domain = "astronomy"
v_class = "V5"
asset_path = "crawl_data/astronomy/ephemeris/saturn_from_earth_2026_conjunction.json"
asset_format = "json"
answer_schema = { fields = ["steps", "final_camera", "success"], kind = "tool_trace" }
scorer = { primary = "v5_trace_efficiency", secondary = [] }
allowed_tools = ["sv3d_open_scene", "sv3d_get_state", "sv3d_camera_set_view", "sv3d_camera_orbit", "sv3d_camera_dolly", "sv3d_render"]
forbidden_tools = []
weights = { content = 0.7, process = 0.3 }

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 900.0
network_mode = "public"

[environment]
build_timeout_sec = 600.0
