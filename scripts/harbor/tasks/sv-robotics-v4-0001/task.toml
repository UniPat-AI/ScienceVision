version = "1.0"

[task]
name = "sci3d/sv-robotics-v4-0001"

[metadata]
domain = "robotics"
v_class = "V4"
asset_path = "crawl_data/robotics/urdf_sdf_samples/kuka_iiwa.urdf"
asset_format = "urdf"
answer_schema = { fields = ["variant_answers", "agreement"], kind = "variant_agreement" }
scorer = { primary = "v4_variant_consistency", secondary = [] }
allowed_tools = ["sv3d_open_scene", "sv3d_get_state", "sv3d_camera_set_view", "sv3d_camera_orbit", "sv3d_camera_dolly", "sv3d_render", "sv_inspect_urdf"]
forbidden_tools = []
weights = { content = 0.7, process = 0.3 }

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 900.0
network_mode = "public"

[environment]
build_timeout_sec = 600.0
