version = "1.0"

[task]
name = "sci3d/sv-astronomy-v2-0001"

[metadata]
domain = "astronomy"
v_class = "V2"
asset_path = "crawl_data/astronomy/ephemeris/saturn_from_earth_2026_conjunction.json"
asset_format = "json"
answer_schema = { fields = ["visibility_class", "view_rationale"], kind = "categorical_visibility" }
scorer = { primary = "v2_visibility_categorical", secondary = [] }
allowed_tools = ["sv3d_open_scene", "sv3d_get_state", "sv3d_camera_set_view", "sv3d_camera_orbit", "sv3d_camera_dolly", "sv3d_render"]
forbidden_tools = ["direct_ephemeris_answer_lookup"]
weights = { content = 0.7, process = 0.3 }

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 900.0
network_mode = "public"

[environment]
build_timeout_sec = 600.0
