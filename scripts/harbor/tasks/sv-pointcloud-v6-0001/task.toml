version = "1.0"

[task]
name = "sci3d/sv-pointcloud-v6-0001"

[metadata]
domain = "pointcloud"
v_class = "V6"
asset_path = "crawl_data/pointcloud/las_samples/laspy_simple.las"
asset_format = "las"
answer_schema = { fields = ["category", "visual_reasoning"], kind = "categorical" }
scorer = { primary = "v6_categorical_with_tool_audit", secondary = [] }
allowed_tools = ["sv3d_open_scene", "sv3d_get_state", "sv3d_camera_set_view", "sv3d_camera_orbit", "sv3d_camera_dolly", "sv3d_render", "sv_inspect_pointcloud"]
forbidden_tools = ["dbscan", "connected_components_pointcloud"]
weights = { content = 0.7, process = 0.3 }

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 900.0
network_mode = "public"

[environment]
build_timeout_sec = 600.0
