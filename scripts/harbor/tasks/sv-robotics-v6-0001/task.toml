version = "1.0"

[task]
name = "sci3d/sv-robotics-v6-0001"

[metadata]
domain = "robotics"
v_class = "V6"
asset_path = "crawl_data/robotics/urdf_sdf_samples/kuka_iiwa.urdf"
asset_format = "urdf"
answer_schema = { fields = ["category", "visual_reasoning"], kind = "categorical" }
scorer = { primary = "v6_categorical_with_tool_audit", secondary = [] }
allowed_tools = ["sv3d_open_scene", "sv3d_get_state", "sv3d_camera_set_view", "sv3d_camera_orbit", "sv3d_camera_dolly", "sv3d_render", "sv_inspect_urdf"]
forbidden_tools = ["kinematic_graph_classifier", "direct_graph_topology_api"]
weights = { content = 0.7, process = 0.3 }

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 900.0
network_mode = "public"

[environment]
build_timeout_sec = 600.0
